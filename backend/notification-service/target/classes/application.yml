spring:
  application.name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${SPRING_DATASOURCE_USERNAME:chx}
    password: ${SPRING_DATASOURCE_PASSWORD:chx}
  jpa.hibernate.ddl-auto: validate
  flyway.locations: classpath:db/migration
  kafka.bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail.host: ${SPRING_MAIL_HOST:localhost}
  mail.port: ${SPRING_MAIL_PORT:1025}
server.port: 8081
