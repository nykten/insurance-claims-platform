spring:
  application:
    name: claims-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${SPRING_DATASOURCE_USERNAME:chx}
    password: ${SPRING_DATASOURCE_PASSWORD:chx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8080
springdoc:
  api-docs:
    path: /v3/api-docs
